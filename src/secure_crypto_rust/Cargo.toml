# 1️⃣ Workspace Cargo.toml

# 📍 `src/secure_crypto_rust/Cargo.toml`

# This is the **orchestrator only**.
# No dependencies here.

# ---------------------------------------------------------------------------
# Workspace root
# ---------------------------------------------------------------------------
[workspace]
resolver = "2"

members = [
    "core",
    "python",
]

# ---------------------------------------------------------------------------
# Shared workspace dependency versions (optional but recommended)
# This prevents version skew between crates.
# ---------------------------------------------------------------------------
[workspace.dependencies]
# Crypto
aes-gcm = { version= "0.11.0-rc.3", features = ["bytes"]}
chacha20poly1305 = { version= "0.11.0-rc.3", features = ["bytes"]}
# experimental crates like `https://crates.io/crates/blake3_aead`
# blake3_aead = { version= "0.1", features = ["bytes"]}

hkdf = "0.13.0-rc.3"
blake3 = "1.8.3"
sha2 = "0.11.0-rc.3"
sha3 = "0.11.0-rc.3"
digest = "0.11.0-rc.5"


# Compression
lz4 = "1.24"
lz4_flex = "0.12"
zstd = "0.13"
zstd-safe = "7.2"
flate2 = "1.0"
futures = "0.3.31"
bytemuck = "1.24.0"
futures-intrusive = "0.5.0"

# Utilities
bitflags = "2.10.0"
byteorder = "1.5"
bytes = "1.11.0"
chrono = { version = "0.4", features = ["serde"] }
crc32fast = "1.5.0"
hex = "0.4"
num_enum = "0.7"
num_cpus = "1.17.0"
ocl = "0.19.7"
opencl3 = "0.12.1"
cl3 = "0.13.1"
pollster = "0.4.0"
wgpu = "28.0.0"
sysinfo = "0.37.2"
base64 = "0.22.1"
rand = "0.8"
thiserror = "1.0"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = { version = "2.0.1", features = ["serde"] }
tempfile = "3"
uuid = { version = "1.19.0", features = ["v4"] }
async-stream = "0.3.6"
async-trait = "0.1.89"
tokio = { version = "1.48.0", features = ["fs"] }
paste = "1.0.15"
once_cell = "1.21.3"
hybrid-array = { version = "0.4.5" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Concurrency (core-safe)
crossbeam = "0.8.4"

# 📦 Property‑Based Tests
# Add this to the `Cargo.toml` (dev‑dependencies):
proptest = "1.5"

# ✅ **Why this matters**

# * One place to bump versions
# * Faster CI
# * No accidental mismatches between core & python
