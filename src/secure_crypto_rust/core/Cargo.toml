# 2️⃣ Core crate (PURE RUST, FAST)

#📍 `src/secure_crypto_rust/core/Cargo.toml`

#This crate contains:

#* `stream_v2`
#* crypto
#* compression
#* telemetry
#* framing

# ---------------------------------------------------------------------------
# crypto-core
# Pure Rust streaming crypto engine
# ---------------------------------------------------------------------------
[package]
name = "crypto-core"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[lib]
name = "crypto_core"
crate-type = ["rlib"] # pure Rust library

[features]
default = []
cuda = ["cust"]

# ---------------------------------------------------------------------------
# Dependencies (CORE ONLY)
# ---------------------------------------------------------------------------
[dependencies]
# --- Crypto primitives ---
aes-gcm.workspace = true
chacha20poly1305.workspace = true
hkdf.workspace = true
blake3.workspace = true
sha2.workspace = true
sha3.workspace = true
digest.workspace = true

# --- Compression ---
lz4.workspace = true
lz4_flex.workspace = true
zstd.workspace = true
zstd-safe.workspace = true
flate2.workspace = true
futures.workspace = true
bytemuck.workspace = true
futures-intrusive.workspace = true


# --- Serialization / framing ---
byteorder.workspace = true
crc32fast.workspace = true
bincode.workspace = true

# --- Error handling ---
thiserror.workspace = true
anyhow.workspace = true

# --- Randomness ---
rand.workspace = true

# --- Telemetry ---
serde.workspace = true
serde_json.workspace = true

# --- Concurrency (used by stream_v2 pipeline) ---
crossbeam.workspace = true

# --- Misc ---
bitflags.workspace = true
bytes.workspace = true
chrono.workspace = true
hex.workspace = true
num_enum.workspace = true
num_cpus.workspace = true
ocl.workspace = true
cust = { version = "0.3.2", optional = true }
pollster.workspace = true
wgpu.workspace = true
sysinfo.workspace = true
base64.workspace = true
tempfile.workspace = true
uuid.workspace = true
async-stream.workspace = true
async-trait.workspace = true
tokio.workspace = true
paste.workspace = true

# ---------------------------------------------------------------------------
# Dev & test dependencies (FAST)
# ---------------------------------------------------------------------------
[dev-dependencies]
criterion = "0.5"
proptest.workspace = true

[[bin]]
name = "bench_v2_memory"
path = "examples/bench_v2_memory.rs"

[[bin]]
name = "bench_v2_file"
path = "examples/bench_v2_file.rs"

[[bin]]
name = "bench_v2_reader"
path = "examples/bench_v2_reader.rs"

[[test]]
name = "public_api"
path = "tests/public_api/mod.rs"
[[test]]
name = "test_public_api"
path = "tests/public_api/test_public_api.rs"
[[test]]
name = "test_roundtrip"
path = "tests/public_api/test_roundtrip.rs"
[[test]]
name = "test_input_variants"
path = "tests/public_api/test_input_variants.rs"
[[test]]
name = "test_output_variants"
path = "tests/public_api/test_output_variants.rs"
[[test]]
name = "test_header_meta"
path = "tests/public_api/test_header_meta.rs"
[[test]]
name = "test_corrupt_detection"
path = "tests/public_api/test_corrupt_detection.rs"
[[test]]
name = "test_parallelism_profiles"
path = "tests/public_api/test_parallelism_profiles.rs"
[[test]]
name = "test_telemetry_config"
path = "tests/public_api/test_telemetry_config.rs"
[[test]]
name = "test_compression_cipher_variants"
path = "tests/public_api/test_compression_cipher_variants.rs"


[[bench]]
name = "bench_dummy"
harness = false

[[bench]]
name = "bench_io_throughput"
harness = false

[[bench]]
name = "bench_parallelism"
harness = false

[[bench]]
name = "bench_segment_sizes"
harness = false

[[bench]]
name = "bench_digest_variants"
harness = false

[[bench]]
name = "bench_v2_memory"
harness = false

# ---------------------------------------------------------------------------
# Build profiles (inherit from workspace)
# ---------------------------------------------------------------------------

### 🔑 Key design decisions

#| Dependency  | Why in core?                              |
#| ----------- | ----------------------------------------- |
#| `crossbeam` | Lock-free queues for **true parallelism** |
#| `bincode`   | Frame encoding                            |
#| `serde`     | Telemetry + digest payload                |
#| `NO tokio`  | Deterministic CPU parallelism             |
#| `NO pyo3`   | 10× faster builds                         |

#This crate is where **Segmented Encrypted Stream v2 lives**.
